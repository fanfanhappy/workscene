name: Release WorkScene

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.3)'
        required: true
        default: 'v1.1.3'

concurrency:
  group: release-workscene
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri application and NSIS installer
        run: pnpm tauri build

      - name: Package portable ZIP
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $ver = $tag.TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } else {
            $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          $stage = "dist-portable/WorkScene-$ver-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/workscene.exe" "$stage/WorkScene.exe"

          @(
            "@echo off",
            "cd /d `"%~dp0`"",
            "set `"WORKSCENE_DATA_DIR=%~dp0data`"",
            "start `"`" `"WorkScene.exe`""
          ) | Set-Content -Path "$stage/start.cmd" -Encoding ASCII

          @(
            "WorkScene $tag 绿色便携版",
            "",
            "使用方式：",
            "1. 推荐双击 start.cmd 启动：所有工作空间与快照数据将保存在本目录 data\ 下，拷贝文件夹即可随身带走。",
            "2. 如直接双击 WorkScene.exe 启动，数据默认保存在当前用户目录（%LOCALAPPDATA%\WorkScene）。",
            "3. 本软件 100% 本地离线，无遥测、不上传数据；如 Windows SmartScreen 提示未知发布者，点击「更多信息」->「仍要运行」即可。"
          ) | Set-Content -Path "$stage/启动说明.txt" -Encoding UTF8

          $zipPath = "dist-portable/WorkScene-$ver-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -CompressionLevel Optimal

          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_VER=$ver" >> $env:GITHUB_ENV
          echo "PORTABLE_ZIP=$zipPath" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $ver = $env:RELEASE_VER
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1 -ExpandProperty FullName
          $zip = (Resolve-Path $env:PORTABLE_ZIP).Path

          if (-not $nsis) {
            throw "NSIS installer not found under src-tauri/target/release/bundle/nsis/"
          }

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          if ($exists) {
            gh release upload $tag $nsis $zip --clobber
          } else {
            gh release create $tag $nsis $zip `
              --target "${{ github.sha }}" `
              --title "WorkScene $tag" `
              --notes-file "docs/RELEASE.md"
          }
