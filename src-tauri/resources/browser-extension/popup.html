<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 "Segoe UI", sans-serif; color: #1d232b; background: #f7f8fa; }
      h1 { margin: 0 0 4px; font-size: 14px; }
      p { margin: 0 0 10px; color: #68717d; }
      #status { padding: 9px; border-radius: 7px; background: #eef1f4; margin-bottom: 10px; }
      #status.ok { background: #e8f6ee; color: #1e6b43; }
      #status.err { background: #fdecec; color: #a33a3a; }
      button { width: 100%; padding: 8px; border: 0; border-radius: 7px; background: #1d232b; color: #fff; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      small { display: block; margin-top: 9px; color: #8a929c; }
    </style>
  </head>
  <body>
    <h1>WorkScene 浏览器标签页</h1>
    <p>只同步当前窗口和 URL 到本机，不上传。</p>
    <div id="status">正在读取状态…</div>
    <button id="sync">立即同步</button>
    <small>需要先在 WorkScene「设置 → 浏览器标签页」安装本机连接。</small>
    <script src="popup.js"></script>
  </body>
</html>
