[package]
name = "workscene"
version = "2.0.1"
description = "WorkScene - Windows workspace manager"
authors = ["WorkScene"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "workscene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

# 本机 MSVC 14.51 编译 sqlite3.c 时，-Z7 会让 cl 报 D8050（命令行放不进调试记录）。
# 只对这个 C 依赖关掉调试信息，不影响 Rust 侧断点。
[profile.dev.package.libsqlite3-sys]
debug = false

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

